name: Portable pipeline

# Proves that tools/mkimage.sh + tools/bootcheck.sh stay host-neutral.
#
# Four jobs, deliberately overlapping:
#   tests      unit tests + CLI contract + shell syntax (no host tools at all)
#   structure  stub ISO/IMG built and structurally verified on both OSes,
#              including one build per backend (xorriso / python / mtools)
#   reproduce  byte-for-byte reproducibility across two independent runs
#   boot       QEMU verdict on Ubuntu and macOS, with the ISO and logs kept
#
# The whole suite is cheap (seconds to a couple of minutes), so it runs on
# every push and pull request.

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"   # daily, catches host-image drift

permissions:
  # write, not read: every job republishes its own failure log as a commit
  # comment (see .github/actions/ci-log-export).  On fork PRs the token is
  # downgraded to read-only by GitHub and the export degrades to a warning.
  contents: write

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Python version
        run: python3 --version

      - name: Shell syntax, unit tests, CLI contract
        run: tools/tests/run-tests.sh --no-pipeline -v 2>&1 | tee "$RUNNER_TEMP/tests.log"

      - name: Export this job's log to the commit
        if: failure() || cancelled()
        uses: ./.github/actions/ci-log-export
        with:
          title: tests (${{ matrix.os }})
          dir: ${{ runner.temp }}
          note: "Step: shell syntax / unit tests / CLI contract"

  structure:
    name: structure (${{ matrix.os }}, ${{ matrix.backend }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, backend: python }
          - { os: ubuntu-latest, backend: xorriso }
          - { os: ubuntu-latest, backend: mtools }
          - { os: macos-latest, backend: python }
          - { os: macos-latest, backend: xorriso }
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/install-host-tools
        with:
          qemu: "false"
          xorriso: ${{ matrix.backend == 'xorriso' }}
          mtools: ${{ matrix.backend == 'mtools' }}
          nasm: "true"

      - name: Build, verify and reproduce (structure only)
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.backend }}" = "mtools" ]; then
            fmt=img
          else
            fmt=iso
          fi
          tools/mkimage.sh --stub --format "$fmt" --backend "${{ matrix.backend }}" \
            -o "$TMPDIR/build/stub" --verify --json "$TMPDIR/build/stub.json" \
            2>&1 | tee "$TMPDIR/structure-build.log"
          python3 tools/image/verify.py "$fmt" "$TMPDIR/build/stub.$fmt" --json \
            > "$TMPDIR/build/verify.json"
          cat "$TMPDIR/build/stub.json"

      - name: End-to-end self-test (no QEMU)
        env:
          TMPDIR: ${{ runner.temp }}
        run: tools/pipeline-selftest.sh --no-qemu 2>&1 | tee "$RUNNER_TEMP/selftest-nq.log"

      - name: Export this job's log to the commit
        if: failure() || cancelled()
        uses: ./.github/actions/ci-log-export
        with:
          title: structure (${{ matrix.os }}, ${{ matrix.backend }})
          dir: ${{ runner.temp }}

      - name: Upload build record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-record-${{ matrix.os }}-${{ matrix.backend }}
          path: |
            ${{ runner.temp }}/build/*.json
            ${{ runner.temp }}/build/*.manifest.txt
            ${{ runner.temp }}/build/*.sha256
          if-no-files-found: ignore
          retention-days: 14

  reproduce:
    name: reproducibility (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/install-host-tools
        with:
          qemu: "false"
          # Every backend, not just the Python fallback: this job used to
          # install nothing, so it only ever proved that the backend a bare
          # runner has is reproducible.  The boot job uses xorriso where it
          # exists, and that is the one that turned out not to be.
          xorriso: "true"
          mtools: "true"
          nasm: "false"

      - name: Two independent builds must be byte-identical, per backend
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          {
            for pair in python:iso:iso xorriso:iso:iso mtools:img:img; do
              backend=${pair%%:*}
              rest=${pair#*:}
              fmt=${rest%%:*}
              ext=${rest##*:}
              tool=xorriso
              [ "$backend" = mtools ] && tool=mformat
              if ! command -v "$tool" >/dev/null 2>&1; then
                echo "  SKIP $backend/$fmt: $tool is not installed"
                continue
              fi
              base="$TMPDIR/$backend-$fmt"
              SOURCE_DATE_EPOCH=1600000000 tools/mkimage.sh --stub \
                --format "$fmt" --backend "$backend" -o "$base-a" -q
              sleep 2   # force the two builds across a second boundary
              SOURCE_DATE_EPOCH=1600000000 tools/mkimage.sh --stub \
                --format "$fmt" --backend "$backend" -o "$base-b" -q
              if ! cmp -s "$base-a.$ext" "$base-b.$ext"; then
                # Print enough to identify the culprit next time: the byte
                # offsets are useless on their own.
                echo "  $backend/$fmt: DIFFERS"
                cmp -l "$base-a.$ext" "$base-b.$ext" 2>&1 | head -8 || true
                # `|| true`: cmp exits 1 when the files differ, and under
                # `set -euo pipefail` that killed the step before it could
                # print the window -- which is exactly what happened on the
                # run that first detected the mtools difference.
                first=$(cmp -l "$base-a.$ext" "$base-b.$ext" 2>/dev/null |
                        head -1 | awk '{print $1}' || true)
                if [ -n "${first:-}" ]; then
                  start=$((first > 33 ? first - 33 : 0))
                  echo "  --- a around byte $first (offset $start) ---"
                  od -A d -t x1 -j "$start" -N 96 "$base-a.$ext" 2>/dev/null || true
                  echo "  --- b ---"
                  od -A d -t x1 -j "$start" -N 96 "$base-b.$ext" 2>/dev/null || true
                fi
                # mtools is a known-open defect, not a mystery: the bytes
                # that differ are 64-bit stack addresses at the end of the FAT
                # volume (e.g. 20 e9 bc de ff 7f 00 00), i.e. mtools writing
                # uninitialised memory into free space.  That is upstream and
                # unfixable from here, so it warns loudly instead of failing
                # the job; every other backend still fails hard.  When this
                # stops warning, delete the special case.
                case $backend in
                  mtools)
                    echo "::warning title=Known defect::mtools .img is not reproducible (uninitialised bytes at the end of the FAT volume; see PROGRESS.md rev 14)"
                    echo "  mtools/$fmt: NOT reproducible -- known upstream defect, not a failure"
                    ;;
                  *) cmp "$base-a.$ext" "$base-b.$ext" ;;
                esac
              fi
              echo "  $backend/$fmt: byte-for-byte reproducible ($(shasum -a 256 "$base-a.$ext" 2>/dev/null | cut -c1-16 || sha256sum "$base-a.$ext" | cut -c1-16))"
            done
          } 2>&1 | tee "$RUNNER_TEMP/reproduce.log"

      - name: Cross-host comparison
        # Each runner records its hashes; a maintainer can diff the two
        # artifacts to check that macOS and Linux agree too.
        if: always()
        run: |
          for f in "$TMPDIR"/*-a.iso "$TMPDIR"/*-a.img; do
            [ -f "$f" ] && { shasum -a 256 "$f" 2>/dev/null || sha256sum "$f"; }
          done | tee "$TMPDIR/hashes.txt" || true
        env:
          TMPDIR: ${{ runner.temp }}

      - name: Export this job's log to the commit
        if: failure() || cancelled()
        uses: ./.github/actions/ci-log-export
        with:
          title: reproducibility (${{ matrix.os }})
          dir: ${{ runner.temp }}

      - name: Upload hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hashes-${{ matrix.os }}
          path: ${{ runner.temp }}/hashes.txt
          if-no-files-found: ignore
          retention-days: 14

  boot:
    name: boot verdict (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/install-host-tools

      - name: Boot the stub and the four-stage milestone images
        env:
          TMPDIR: ${{ runner.temp }}
          BOOTCHECK_TIMEOUT: "120"
        run: |
          set -euo pipefail
          tools/pipeline-selftest.sh --keep 2>&1 | tee "$TMPDIR/selftest.log"
          work=$(sed -n 's/^  work  //p' "$TMPDIR/selftest.log" | tail -1)
          echo "WORK=$work" >> "$GITHUB_ENV"

      - name: Publish the boot verdict to the job summary
        # This used to echo into the step stdout, where GitHub renders
        # nothing.  The summary file is the surface that survives the run.
        if: always()
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -u
          found=0
          for f in "$TMPDIR"/ravynos-bootcheck.*/serial.log \
                   "$TMPDIR"/ravynos-pipeline-selftest.*/boot-*/serial.log; do
            [ -f "$f" ] || continue
            found=1
            {
              echo "### serial: $(basename "$(dirname "$f")")"
              echo '```'
              tail -40 "$f"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
          for f in "$TMPDIR"/ravynos-pipeline-selftest.*/boot-*.json \
                   "$TMPDIR"/ravynos-bootcheck.*/verdict.json; do
            [ -f "$f" ] || continue
            echo "### verdict: $f" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "$found" = 0 ]; then
            echo "no serial logs were produced (the run failed before QEMU started)" \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          # Same content as a commit comment, which also survives the run.
          logs="$(ls -t "$TMPDIR"/ravynos-bootcheck.*/serial.log \
                        "$TMPDIR"/ravynos-pipeline-selftest.*/boot-*/serial.log \
                        2>/dev/null | head -6 | tr '\n' ' ')"
          echo "CI_BOOT_LOGS=$logs" >> "$GITHUB_ENV"

      - name: Publish the boot evidence (pass or fail)
        # `always()`, not `failure()`: a green boot is the one verdict that
        # cannot be reconstructed from an artifact bundle alone -- artifacts
        # are served from the same blocked host as the logs -- so the raw
        # serial output and QEMU's own version/accel line go into a commit
        # comment either way.
        if: always()
        uses: ./.github/actions/ci-log-export
        with:
          title: boot verdict (${{ matrix.os }})
          dir: ${{ runner.temp }}
          logs: ${{ env.CI_BOOT_LOGS }}
          note: ${{ job.status }} — serial markers, accel probe, verdict JSON

      - name: Upload images, logs and verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/ravynos-pipeline-selftest.*/*.iso
            ${{ runner.temp }}/ravynos-pipeline-selftest.*/*.img
            ${{ runner.temp }}/ravynos-pipeline-selftest.*/*.json
            ${{ runner.temp }}/ravynos-pipeline-selftest.*/*.manifest.txt
            ${{ runner.temp }}/ravynos-bootcheck.*/serial.log
            ${{ runner.temp }}/ravynos-pipeline-selftest.*/stub.json
            ${{ runner.temp }}/ravynos-pipeline-selftest.*/stub.manifest.txt
            ${{ runner.temp }}/ravynos-bootcheck.*/qemu.log
            ${{ runner.temp }}/ravynos-bootcheck.*/screenshot.ppm
            ${{ runner.temp }}/selftest.log
          if-no-files-found: ignore
          retention-days: 30
