name: Install host tools
description: >
  Install the host tools the portable image pipeline uses, on Ubuntu and macOS.
  Everything installed here is optional at runtime: tools/mkimage.sh falls back
  to the dependency-free Python backends when xorriso or mtools are missing,
  so CI deliberately exercises both the "full toolchain" and "bare runner"
  paths (see .github/workflows/pipeline.yml).

inputs:
  qemu:
    description: Install QEMU as well (needed for boot checks)
    required: false
    default: "true"
  xorriso:
    description: Install xorriso (ISO backend)
    required: false
    default: "true"
  mtools:
    description: Install mtools (FAT/ESP backend for .img)
    required: false
    default: "true"
  nasm:
    description: Install nasm (boot stub assembler)
    required: false
    default: "true"
  ovmf:
    description: Install OVMF firmware (Linux; needed for --uefi boots)
    required: false
    default: "false"
  clang:
    description: Install clang and lld (Linux; builds tools/bootloader)
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install tools (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        pkgs=""
        [ "${{ inputs.xorriso }}" = "true" ] && pkgs="$pkgs xorriso"
        [ "${{ inputs.mtools }}" = "true" ] && pkgs="$pkgs mtools"
        [ "${{ inputs.nasm }}" = "true" ] && pkgs="$pkgs nasm"
        [ "${{ inputs.qemu }}" = "true" ] && pkgs="$pkgs qemu-system-x86"
        [ "${{ inputs.ovmf }}" = "true" ] && pkgs="$pkgs ovmf"
        [ "${{ inputs.clang }}" = "true" ] && pkgs="$pkgs clang lld"
        # file(1) and dosfstools are useful when diagnosing artifacts.
        pkgs="$pkgs file dosfstools"
        if [ -z "${pkgs# }" ]; then
          echo "nothing to install (all inputs false)"
        else
          echo "installing:$pkgs"
          sudo apt-get install -y -qq $pkgs
        fi

    - name: Install tools (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        pkgs=""
        [ "${{ inputs.xorriso }}" = "true" ] && pkgs="$pkgs xorriso"
        [ "${{ inputs.mtools }}" = "true" ] && pkgs="$pkgs mtools"
        [ "${{ inputs.nasm }}" = "true" ] && pkgs="$pkgs nasm"
        [ "${{ inputs.qemu }}" = "true" ] && pkgs="$pkgs qemu"
        # macOS ships clang in the Xcode command line tools, and qemu brings
        # edk2-*-code.fd, so the ovmf/clang inputs need nothing extra here.
        if [ -z "${pkgs# }" ]; then
          # `brew install` with no formula is an error, so a job that asked
          # for nothing (the reproducibility job) used to fail while setting
          # up its toolchain -- before it had run a single test.
          echo "nothing to install (all inputs false)"
        else
          echo "installing:$pkgs"
          # Homebrew on macOS runners is preinstalled; no full auto-update.
          HOMEBREW_NO_AUTO_UPDATE=1 brew install $pkgs
        fi

    - name: Report tool versions
      shell: bash
      run: tools/mkimage.sh --list-tools
